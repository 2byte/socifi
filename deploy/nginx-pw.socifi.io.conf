# nginx reverse proxy for pw.socifi.io
#
# The domain is served through Cloudflare, which terminates TLS, so the origin
# only needs a plain HTTP :80 server block.
#
# The SPA calls the API under /api, but the backend has no such prefix (the dev
# server strips it the same way), so /api/ is proxied with the prefix removed.
# That location also upgrades to WebSocket for the note-post modules
# (/api/post/:id/internal/:slug/ws).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name pw.socifi.io;

    client_max_body_size 16m;

    location /api/ {
        proxy_pass http://127.0.0.1:3075/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # WebSockets idle between messages; keep them open for an hour.
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3075;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
