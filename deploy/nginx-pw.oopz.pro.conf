# nginx reverse proxy for pw.oopz.pro
#
#   cp deploy/nginx-pw.oopz.pro.conf /etc/nginx/sites-available/pw.oopz.pro.conf
#   ln -sfn /etc/nginx/sites-available/pw.oopz.pro.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# The domain is proxied through Cloudflare in "Full (strict)" SSL mode (set by a
# Configuration Rule for this hostname only; jobmail.oopz.pro on this server
# stays on Flexible). Cloudflare connects to this server over HTTPS on 443 and
# validates the certificate, which is a wildcard Cloudflare Origin CA certificate (*.oopz.pro, oopz.pro):
#
#   /etc/ssl/cloudflare/oopz.pro.pem   (certificate)
#   /etc/ssl/cloudflare/oopz.pro.key   (private key, chmod 600)
#
# Port 80 stays open and serves the same site without a redirect, so the switch
# from Flexible is safe in either order: install the cert and reload nginx
# first, then change the mode in Cloudflare. A redirect 80 -> 443 can be added
# only after the mode is Full (strict), otherwise Flexible would loop.
#
# The SPA calls the API under /api, but the backend has no such prefix (the dev
# server strips it the same way), so /api/ is proxied with the prefix removed.
# That location also upgrades to WebSocket for the note-post modules
# (/api/post/:id/internal/:slug/ws).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pw.oopz.pro;

    ssl_certificate     /etc/ssl/cloudflare/oopz.pro.pem;
    ssl_certificate_key /etc/ssl/cloudflare/oopz.pro.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Restore the visitor's real address from Cloudflare's header, so the app
    # (session list, logs) sees the client rather than a Cloudflare edge node.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Attachments go through /api; keep this above MAX_UPLOAD_BYTES (25 MB) plus form overhead.
    client_max_body_size 30m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3075/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # WebSockets idle between messages; keep them open for an hour.
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3075;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
